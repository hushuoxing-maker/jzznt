<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>家装全链路智能体 · 户型图上传AI分析系统 | 全自动设计引擎 + 5大组全链路方案</title>
    <style>
        :root {
            --bg: #08090b;
            --panel: #111318;
            --card: #181b20;
            --border: #242830;
            --accent: #c8a45c;
            --accent2: #e0c878;
            --blue: #5b9bd5;
            --green: #3cb878;
            --red: #e05560;
            --text: #e0e0e0;
            --muted: #6e7178;
            --label: #909298;
            --tag-bg: #1c1e24;
            --tag-selected: rgba(200,164,92,0.2);
            --tag-multi: rgba(91,155,213,0.2);
            --radius: 5px;
            --radius-lg: 8px;
            --radius-pill: 20px;
            --font-mono: 'JetBrains Mono','Fira Code','Consolas',monospace;
            --font-sans: 'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
            --transition: 0.2s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:200;gap:10px;flex-wrap:wrap;}
        .topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
        .logo{font-size:11px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;}
        .topbar-title{font-size:10px;font-weight:500;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
        .topbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
        .btn-accent{padding:7px 16px;background:var(--accent);color:#1a1a1a;border:none;font-size:11px;font-weight:700;cursor:pointer;border-radius:var(--radius);transition:all var(--transition);font-family:inherit;}
        .btn-accent:hover{background:var(--accent2);transform:translateY(-1px);}
        .btn-accent2{padding:7px 16px;background:var(--blue);color:#fff;border:none;font-size:11px;font-weight:700;cursor:pointer;border-radius:var(--radius);transition:all var(--transition);font-family:inherit;}
        .btn-accent2:hover{background:#7ab8f0;}
        .btn-ghost{padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--label);font-size:10px;cursor:pointer;border-radius:var(--radius);font-family:inherit;}
        .btn-ghost:hover{border-color:#555;color:var(--text);}
        .badge{font-size:9px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--accent);color:#1a1a1a;font-weight:700;}
        .main{display:grid;grid-template-columns:480px 1fr;flex:1;overflow:hidden;}
        .left-panel{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;height:calc(100vh - 48px);position:sticky;top:48px;overflow-y:auto;}
        .left-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-shrink:0;}
        .left-title{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--label);text-transform:uppercase;}
        .selected-count{font-size:9px;color:var(--accent);font-family:var(--font-mono);}
        .left-scroll{flex:1;overflow-y:auto;padding:6px 0;}
        .accordion{border-bottom:1px solid rgba(255,255,255,0.04);}
        .accordion-header{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;user-select:none;transition:background var(--transition);}
        .accordion-header:hover{background:rgba(255,255,255,0.02);}
        .accordion-label{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--label);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
        .accordion-icon{font-size:9px;color:var(--muted);transition:transform var(--transition);}
        .accordion.open .accordion-icon{transform:rotate(180deg);}
        .accordion-body{display:none;padding:6px 16px 12px;}
        .accordion.open .accordion-body{display:block;}
        .tag-group{margin-bottom:8px;}
        .tag-group-title{font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;padding-left:6px;border-left:2px solid var(--accent);}
        .tags{display:flex;flex-wrap:wrap;gap:4px;}
        .tag{padding:3px 9px;background:var(--tag-bg);border:1px solid var(--border);color:var(--label);font-size:10px;border-radius:var(--radius-pill);cursor:pointer;transition:all var(--transition);user-select:none;}
        .tag:hover{border-color:#444;color:#ccc;}
        .tag.selected{background:var(--tag-selected);border-color:var(--accent);color:var(--accent2);font-weight:500;}
        .tag.multi-selected{background:var(--tag-multi);border-color:var(--blue);color:#8cc8ff;}
        .input-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
        .input-row label{font-size:9px;color:var(--muted);letter-spacing:1px;}
        .input-row input,.input-row select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-size:11px;border-radius:var(--radius);width:100%;font-family:inherit;}
        .input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent);}
        .upload-area{margin:8px 16px 12px;background:rgba(200,164,92,0.08);border:1px dashed var(--accent);border-radius:var(--radius-lg);padding:12px;text-align:center;}
        .upload-label{display:inline-block;background:var(--accent);color:#1a1a1a;padding:6px 14px;border-radius:var(--radius-pill);font-size:10px;cursor:pointer;margin-bottom:8px;}
        .upload-status{font-size:9px;color:var(--label);margin-top:6px;}
        .analysis-result{background:var(--card);border-radius:var(--radius);padding:10px;margin-top:10px;font-size:9px;line-height:1.5;max-height:200px;overflow-y:auto;}
        .score-bar{height:4px;background:var(--border);border-radius:2px;margin:4px 0;width:100%;}
        .score-fill{height:4px;background:var(--accent2);border-radius:2px;width:0%;}
        .right-panel{background:var(--bg);display:flex;flex-direction:column;height:calc(100vh - 48px);overflow:hidden;}
        .right-header{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
        .right-title{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--label);}
        .right-tabs{display:flex;gap:3px;}
        .right-tab{padding:5px 12px;font-size:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--label);border-radius:var(--radius);font-family:inherit;}
        .right-tab.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600;}
        .right-scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
        .report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px;}
        .report-card h3{font-size:14px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:8px;}
        .prompt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
        .prompt-num{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--accent);font-family:var(--font-mono);}
        .prompt-text{font-size:11px;color:#c0c0c0;line-height:1.7;word-break:break-word;}
        .btn-copy{padding:4px 10px;background:transparent;border:1px solid var(--border);color:var(--label);font-size:9px;cursor:pointer;border-radius:var(--radius);align-self:flex-end;}
        .btn-copy:hover{border-color:var(--accent);color:var(--accent);}
        .btn-copy.copied{border-color:var(--green);color:var(--green);}
        .budget-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px;}
        .budget-table th,.budget-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
        .budget-total{font-size:15px;font-weight:700;color:var(--accent2);text-align:right;margin-top:8px;}
        .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 20px;border-radius:var(--radius);font-size:11px;font-weight:600;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.3s;}
        .toast.show{opacity:1;}
        /* 优化版式比例 - 全链路5大组方案 - 完全展示文本 */
        .full-suite-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 18px; overflow: hidden; }
        .suite-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1a1d24; border-bottom: 1px solid var(--border); }
        .suite-title { font-size: 13px; font-weight: 700; color: var(--accent); }
        .spaces-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 14px; }
        .space-item { background: #0f1117; border: 1px solid var(--border); border-radius: 10px; padding: 10px; transition: 0.1s; }
        .space-item:hover { border-color: #3a3e48; }
        .space-name { font-weight: 700; color: var(--accent2); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        /* 关键修改：预览框高度自动，完全展示文本，并允许滚动条 */
        .suite-prompt-preview { 
            font-size: 10px; 
            color: #b0b3bc; 
            background: #0a0c10; 
            padding: 10px; 
            border-radius: 6px; 
            margin: 6px 0; 
            white-space: pre-wrap; 
            word-break: break-word; 
            max-height: none;      /* 移除高度限制，完全展示 */
            overflow-y: visible;   /* 不强制滚动，如果需要滚动由父容器处理 */
            line-height: 1.5; 
        }
        /* 如果内容过长导致页面溢出，可启用最大高度并滚动，但优先完全展示 */
        .btn-copy-suite { background: transparent; border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; font-size: 9px; cursor: pointer; color: var(--label); transition: 0.1s; }
        .btn-copy-suite:hover { border-color: var(--accent); color: var(--accent); background: rgba(200,164,92,0.1); }
        .right-scroll { gap: 14px; }
        @media(max-width:1000px){.main{grid-template-columns:1fr;}.left-panel{height:auto;max-height:45vh;position:relative;top:0;}}
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left"><span class="logo">◆ 家装AI · 户型图智析系统</span><span class="topbar-title">全自动设计引擎 | 上传即分析</span></div>
    <div class="topbar-actions"><span class="badge" id="totalBadge">0组</span><button class="btn-ghost" onclick="clearAll()">清空</button><button class="btn-accent2" onclick="generateFullReport()">📐 全链路分析报告</button><button class="btn-accent" onclick="generatePrompts()">✨ 生成AI设计提示词</button></div>
</div>
<div class="main">
    <div class="left-panel">
        <div class="left-header"><span class="left-title">🏷️ 户型图智能分析 + 参数控制台</span><span class="selected-count" id="selCount">已选0项</span></div>
        <div class="left-scroll" id="leftScroll">
            <!-- 动态注入 upload + 参数区 -->
        </div>
    </div>
    <div class="right-panel"><div class="right-header"><span class="right-title" id="rightTitle">🏡 智能设计输出</span><div class="right-tabs"><button class="right-tab active" data-tab="report" onclick="switchTab('report')">📊 分析报告</button><button class="right-tab" data-tab="prompts" onclick="switchTab('prompts')">📝 提示词</button><button class="right-tab" data-tab="budget" onclick="switchTab('budget')">💰 预算精算</button><button class="right-tab" data-tab="fullsuite" onclick="switchTab('fullsuite')">🏆 全链路5大组方案</button></div><button class="btn-ghost" id="copyAllBtn" onclick="copyAllPrompts()">📋 复制全部提示词</button><button class="btn-ghost" id="copyAllSuiteBtn" onclick="copyAllSuite()" style="display:none;">📋 复制全部5大组</button></div><div class="right-scroll" id="rightScroll"></div></div>
</div>
<div class="toast" id="toast">✓ 已复制</div>
<script>
(function(){
    // --------------------------------------------------------------
    // 全域家装数据库 (所有分类均为多选) - 完全保留原样

        let funcNeeds = [];

    function copyText(text, btn){

        if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>copySuccess(btn)).catch(fallback); else fallback(); 
    }
    function copySuccess(btn){ if(btn){ btn.classList.add('copied'); btn.textContent='✓ 已复制'; setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent='📋 复制'; },1800); } showToast('✅ 已复制'); }
    function copyError(btn){ if(btn){ btn.textContent='⚠ 重试'; setTimeout(()=>{ btn.textContent='📋 复制'; },2000); } showToast('❌ 复制失败'); }

        const spaces = {
            xuan_guan: { name: "玄关", text: `${designSystem}\n【玄关空间】入户第一印象，通顶鞋柜+换鞋凳+端景台，线性灯带引导动线，地面与客厅材质统一延伸，镜面扩大空间感。超写实渲染，人眼视角。 --ar 16:9` },
            living: { name: "客厅", text: `${designSystem}\n【客厅空间】核心社交区，模块沙发+茶几+电视墙/投影，无主灯设计，落地窗引入自然光，地毯与艺术品提升质感，绿植点缀。超广角，电影级光影。 --ar 16:9` },
            dining: { name: "餐厅", text: `${designSystem}\n【餐厅空间】岩板餐桌+皮餐椅，吊灯聚焦，餐边柜兼酒柜，与客厅互通形成流畅动线，氛围照明营造用餐仪式感。 --ar 16:9` },
            kitchen: { name: "厨房", text: `${designSystem}\n【厨房空间】开放式/半开放式，U型或L型布局，岛台+高柜，内嵌电器，防油污材质，照明充足，操作台面宽敞。 --ar 16:9` },
            master: { name: "主卧", text: `${designSystem}\n【主卧空间】静谧睡眠区，双人床+床头柜+衣柜，背景墙软包/木饰面，遮光窗帘，阅读壁灯，暖光舒适，衣帽间/梳妆区整合。 --ar 16:9` },
            second: { name: "次卧", text: `${designSystem}\n【次卧空间】多功能客房/老人房，榻榻米或标准床，简约衣柜，书桌预留，柔光照明，适老化细节可选。 --ar 16:9` },
            kids: { name: "儿童房", text: `${designSystem}\n【儿童房空间】成长型设计，上下床/单人床+学习区+游戏地垫，色彩活泼安全，圆角家具，储物丰富。 --ar 16:9` },
            bathroom: { name: "卫生间", text: `${designSystem}\n【卫生间空间】干湿三分离，双台盆/独立淋浴房，防滑地砖，镜柜+壁龛收纳，暖风照明一体，高级质感。 --ar 16:9` },
            balcony: { name: "阳台", text: `${designSystem}\n【阳台空间】生活+休闲一体，洗衣区收纳柜，绿植点缀，与客厅打通形成地台或玻璃移门，引入自然光。 --ar 16:9` }
        };
        
        // 3. 全屋平面布局方案提示词
        const layoutPrompt = `${designSystem}\n【全屋平面布局方案】CAD建筑平面图风格，展示${houseType}完整户型结构，比例1:50。包含：墙体、门窗、承重墙、功能分区（玄关、客厅、餐厅、厨房、主卧、次卧、儿童房、卫生间、阳台、储物区）。家具模块按人体工程学布置（沙发、餐桌、床、衣柜、洗手台）。动线箭头表示主动线与次动线，采光通风图示虚线标注窗位置。彩平图风格，不同区域淡色区分，顶部标注长宽尺寸及面积，专业室内设计制图规范。 --ar 1:1 --no color`;
        
        // 4. 全屋施工深化方案提示词
        const constructionPrompt = `${designSystem}\n【全屋施工深化方案】工程制图套件，包含：①天花吊顶图(标高+灯具定位) ②地面铺装图(材质拼缝+标高) ③墙面立面图(背景墙/柜体尺寸) ④水电布置图(强弱电点位+给排水) ⑤灯光布置图(回路+色温标注) ⑥柜体定制图(结构+收口) ⑦节点工艺大样(阴阳角/收口/防水) ⑧CAD施工图标准表达。白色/黑色背景，线条清晰，标注材料编号及施工说明。专业深化设计图纸风格。 --ar 16:9`;
        
        // 5. 全屋展示提案方案提示词
        const proposalPrompt = `${designSystem}\n【全屋展示提案方案】全案设计汇报图集：①全屋鸟瞰图(整体布局) ②全屋漫游轴测图 ③客餐厅联动透视图 ④昼景自然光效果 ⑤夜景暖光氛围 ⑥软装搭配拼图 ⑦材质工艺特写(木饰面/岩板/微水泥) ⑧设计概念展板。统一${styleDefault}调性，电影级调色，版式干净，展示设计逻辑与生活方式。适用于设计提案/营销展示。 --ar 16:9`;
        
        fullSuiteData = { overall: overallPrompt, spaces, layout: layoutPrompt, construction: constructionPrompt, proposal: proposalPrompt };
        
        // 如果当前在fullsuite标签页，则刷新渲染
        if(currentTab === 'fullsuite') renderFullSuite();
    }
    
    function renderFullSuite() {
        if(!fullSuiteData) {
            dom.rightScroll.innerHTML = '<div class="report-card"><p>请先选择户型参数或上传户型图，系统将自动生成5大组全链路方案。</p></div>';
            return;
        }
        let data = fullSuiteData;
        let html = `
            <!-- 第1组：全屋空间方案 -->
            <div class="full-suite-card">
                <div class="suite-header"><div class="suite-title">① 全屋空间方案提示词 (整体统一场景)</div><button class="btn-copy-suite" onclick="copySuiteItem('overall')">📋 复制本段</button></div>
                <div style="padding: 14px;"><div class="suite-prompt-preview" id="suite_overall">${escapeHtml(data.overall)}</div></div>
            </div>
            <!-- 第2组：分空间方案 9个独立卡片 -->
            <div class="full-suite-card">
                <div class="suite-header"><div class="suite-title">② 分空间方案提示词 (9大区域独立复制)</div></div>
                <div class="spaces-grid" id="suiteSpacesGrid"></div>
            </div>
            <!-- 第3组：平面布局方案 -->
            <div class="full-suite-card">
                <div class="suite-header"><div class="suite-title">③ 平面布局方案提示词</div><button class="btn-copy-suite" onclick="copySuiteItem('layout')">📋 复制本段</button></div>
                <div style="padding: 14px;"><div class="suite-prompt-preview" id="suite_layout">${escapeHtml(data.layout)}</div></div>
            </div>
            <!-- 第4组：施工深化方案 -->
            <div class="full-suite-card">
                <div class="suite-header"><div class="suite-title">④ 施工深化方案提示词</div><button class="btn-copy-suite" onclick="copySuiteItem('construction')">📋 复制本段</button></div>
                <div style="padding: 14px;"><div class="suite-prompt-preview" id="suite_construction">${escapeHtml(data.construction)}</div></div>
            </div>
            <!-- 第5组：展示提案方案 -->
            <div class="full-suite-card">
                <div class="suite-header"><div class="suite-title">⑤ 展示提案方案提示词</div><button class="btn-copy-suite" onclick="copySuiteItem('proposal')">📋 复制本段</button></div>
                <div style="padding: 14px;"><div class="suite-prompt-preview" id="suite_proposal">${escapeHtml(data.proposal)}</div></div>
            </div>
        `;
        dom.rightScroll.innerHTML = html;
        // 填充空间网格
        const grid = document.getElementById('suiteSpacesGrid');
        if(grid && data.spaces) {
            let spacesHtml = '';
            for(let [key, val] of Object.entries(data.spaces)) {
                spacesHtml += `
                    <div class="space-item">
                        <div class="space-name">${val.name}<button class="btn-copy-suite" onclick="copySuiteSpace('${key}')">复制</button></div>
                        <div class="suite-prompt-preview" style="max-height: none;">${escapeHtml(val.text)}</div>
                    </div>
                `;
            }
            grid.innerHTML = spacesHtml;
        }
    }
    
    function copySuiteItem(type) {
        if(!fullSuiteData) return;
        let text = '';
        if(type === 'overall') text = fullSuiteData.overall;
        else if(type === 'layout') text = fullSuiteData.layout;
        else if(type === 'construction') text = fullSuiteData.construction;
        else if(type === 'proposal') text = fullSuiteData.proposal;
        if(text) copyText(text, null);
        else showToast('未找到内容');
    }
    function copySuiteSpace(spaceKey) {
        if(fullSuiteData && fullSuiteData.spaces[spaceKey]) {
            copyText(fullSuiteData.spaces[spaceKey].text, null);
        } else showToast('未找到');
    }
    function copyAllSuite() {
        if(!fullSuiteData) { showToast('请先生成全链路方案'); return; }
        let allText = `【全屋空间方案】\n${fullSuiteData.overall}\n\n---\n\n`;
        for(let [key,val] of Object.entries(fullSuiteData.spaces)) {
            allText += `【${val.name}空间】\n${val.text}\n\n---\n\n`;
        }
        allText += `【平面布局方案】\n${fullSuiteData.layout}\n\n---\n\n`;
        allText += `【施工深化方案】\n${fullSuiteData.construction}\n\n---\n\n`;
        allText += `【展示提案方案】\n${fullSuiteData.proposal}`;
        copyText(allText, null);
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; });
    }
    
    // 标签页切换（修改以支持新标签页）
    function switchTab(tab){
        currentTab=tab; 
        $$('.right-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
        if(tab === 'prompts'){
            dom.copyAllBtn.style.display = 'inline-block';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '📝 AI提示词库';
            if(generatedPrompts.length) renderPrompts();
            else dom.rightScroll.innerHTML = '<div class="report-card"><p>请点击顶部「生成AI设计提示词」</p></div>';
        } else if(tab === 'report'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '📊 分析报告';
            if(fullReport) dom.rightScroll.innerHTML = fullReport;
            else generateFullReport();
        } else if(tab === 'budget'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '💰 报价精算';
            renderBudgetFull();
        } else if(tab === 'fullsuite'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'inline-block';
            dom.rightTitle.textContent = '🏆 全链路5大组方案';
            if(fullSuiteData) renderFullSuite();
            else { generateFullSuite(); renderFullSuite(); }
        }
    }
    
    // 暴露新方法给全局
    window.copySuiteItem = copySuiteItem;
    window.copySuiteSpace = copySuiteSpace;
    window.copyAllSuite = copyAllSuite;
    window.generateFullSuite = generateFullSuite;
    
    // 原有全局方法保留
    window.toggleAccordion = toggleAccordion;
    window.generateFullReport = generateFullReport;
    window.generatePrompts = generatePrompts;
    window.copySinglePrompt = copySinglePrompt;
    window.copyAllPrompts = copyAllPrompts;
    window.clearAll = clearAll;
    window.switchTab = switchTab;
    
    // 初始化
    buildLeft(); 
    updateSelCount(); 
    setTimeout(()=>{
        generateFullReport();
        generateFullSuite();   // 预生成5大组方案
    },200);
})();
</script>
</body>
</html>
