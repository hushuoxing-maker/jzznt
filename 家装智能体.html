<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>家装全链路智能体 · 户型图上传AI分析系统 | 5组独立全链路方案</title>
    <style>
        :root {
            --bg: #08090b;
            --panel: #111318;
            --card: #181b20;
            --border: #242830;
            --accent: #c8a45c;
            --accent2: #e0c878;
            --blue: #5b9bd5;
            --green: #3cb878;
            --red: #e05560;
            --text: #e0e0e0;
            --muted: #6e7178;
            --label: #909298;
            --tag-bg: #1c1e24;
            --tag-selected: rgba(200,164,92,0.2);
            --tag-multi: rgba(91,155,213,0.2);
            --radius: 5px;
            --radius-lg: 8px;
            --radius-pill: 20px;
            --font-mono: 'JetBrains Mono','Fira Code','Consolas',monospace;
            --font-sans: 'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
            --transition: 0.2s ease;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:200;gap:10px;flex-wrap:wrap;}
        .topbar-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
        .logo{font-size:11px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;}
        .topbar-title{font-size:10px;font-weight:500;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
        .topbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
        .btn-accent{padding:7px 16px;background:var(--accent);color:#1a1a1a;border:none;font-size:11px;font-weight:700;cursor:pointer;border-radius:var(--radius);transition:all var(--transition);font-family:inherit;}
        .btn-accent:hover{background:var(--accent2);transform:translateY(-1px);}
        .btn-accent2{padding:7px 16px;background:var(--blue);color:#fff;border:none;font-size:11px;font-weight:700;cursor:pointer;border-radius:var(--radius);transition:all var(--transition);font-family:inherit;}
        .btn-accent2:hover{background:#7ab8f0;}
        .btn-ghost{padding:6px 14px;border:1px solid var(--border);background:transparent;color:var(--label);font-size:10px;cursor:pointer;border-radius:var(--radius);font-family:inherit;}
        .btn-ghost:hover{border-color:#555;color:var(--text);}
        .badge{font-size:9px;padding:3px 9px;border-radius:var(--radius-pill);background:var(--accent);color:#1a1a1a;font-weight:700;}
        .main{display:grid;grid-template-columns:480px 1fr;flex:1;overflow:hidden;}
        .left-panel{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;height:calc(100vh - 48px);position:sticky;top:48px;overflow-y:auto;}
        .left-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-shrink:0;}
        .left-title{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--label);text-transform:uppercase;}
        .selected-count{font-size:9px;color:var(--accent);font-family:var(--font-mono);}
        .left-scroll{flex:1;overflow-y:auto;padding:6px 0;}
        .accordion{border-bottom:1px solid rgba(255,255,255,0.04);}
        .accordion-header{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;user-select:none;transition:background var(--transition);}
        .accordion-header:hover{background:rgba(255,255,255,0.02);}
        .accordion-label{font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--label);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
        .accordion-icon{font-size:9px;color:var(--muted);transition:transform var(--transition);}
        .accordion.open .accordion-icon{transform:rotate(180deg);}
        .accordion-body{display:none;padding:6px 16px 12px;}
        .accordion.open .accordion-body{display:block;}
        .tag-group{margin-bottom:8px;}
        .tag-group-title{font-size:8px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;padding-left:6px;border-left:2px solid var(--accent);}
        .tags{display:flex;flex-wrap:wrap;gap:4px;}
        .tag{padding:3px 9px;background:var(--tag-bg);border:1px solid var(--border);color:var(--label);font-size:10px;border-radius:var(--radius-pill);cursor:pointer;transition:all var(--transition);user-select:none;}
        .tag:hover{border-color:#444;color:#ccc;}
        .tag.selected{background:var(--tag-selected);border-color:var(--accent);color:var(--accent2);font-weight:500;}
        .tag.multi-selected{background:var(--tag-multi);border-color:var(--blue);color:#8cc8ff;}
        .input-row{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
        .input-row label{font-size:9px;color:var(--muted);letter-spacing:1px;}
        .input-row input,.input-row select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-size:11px;border-radius:var(--radius);width:100%;font-family:inherit;}
        .input-row input:focus,.input-row select:focus{outline:none;border-color:var(--accent);}
        .upload-area{margin:8px 16px 12px;background:rgba(200,164,92,0.08);border:1px dashed var(--accent);border-radius:var(--radius-lg);padding:12px;text-align:center;}
        .upload-label{display:inline-block;background:var(--accent);color:#1a1a1a;padding:6px 14px;border-radius:var(--radius-pill);font-size:10px;cursor:pointer;margin-bottom:8px;}
        .upload-status{font-size:9px;color:var(--label);margin-top:6px;}
        .analysis-result{background:var(--card);border-radius:var(--radius);padding:10px;margin-top:10px;font-size:9px;line-height:1.5;max-height:200px;overflow-y:auto;}
        .score-bar{height:4px;background:var(--border);border-radius:2px;margin:4px 0;width:100%;}
        .score-fill{height:4px;background:var(--accent2);border-radius:2px;width:0%;}
        .right-panel{background:var(--bg);display:flex;flex-direction:column;height:calc(100vh - 48px);overflow:hidden;}
        .right-header{padding:10px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
        .right-title{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--label);}
        .right-tabs{display:flex;gap:3px;}
        .right-tab{padding:5px 12px;font-size:10px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--label);border-radius:var(--radius);font-family:inherit;}
        .right-tab.active{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600;}
        .right-scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
        .report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px;}
        .report-card h3{font-size:14px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:8px;}
        .prompt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
        .prompt-num{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--accent);font-family:var(--font-mono);}
        .prompt-text{font-size:11px;color:#c0c0c0;line-height:1.7;word-break:break-word;}
        .btn-copy{padding:4px 10px;background:transparent;border:1px solid var(--border);color:var(--label);font-size:9px;cursor:pointer;border-radius:var(--radius);align-self:flex-end;}
        .btn-copy:hover{border-color:var(--accent);color:var(--accent);}
        .btn-copy.copied{border-color:var(--green);color:var(--green);}
        .budget-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px;}
        .budget-table th,.budget-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
        .budget-total{font-size:15px;font-weight:700;color:var(--accent2);text-align:right;margin-top:8px;}
        .toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 20px;border-radius:var(--radius);font-size:11px;font-weight:600;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.3s;}
        .toast.show{opacity:1;}
        /* 5组方案样式 */
        .suite-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .suite-tab { background: transparent; border: 1px solid var(--border); padding: 6px 20px; border-radius: 30px; font-size: 11px; cursor: pointer; color: var(--label); }
        .suite-tab.active { background: var(--accent); color: #111; border-color: var(--accent); }
        .full-suite-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 18px; overflow: visible; }
        .suite-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 18px; background: #1a1d24; border-bottom: 1px solid var(--border); }
        .suite-title { font-size: 13px; font-weight: 700; color: var(--accent); }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-icon { background: transparent; border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; font-size: 10px; cursor: pointer; color: var(--label); transition: 0.1s; }
        .btn-icon:hover { border-color: var(--accent); color: var(--accent); background: rgba(200,164,92,0.1); }
        .spaces-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 16px; }
        .space-item { background: #0f1117; border: 1px solid var(--border); border-radius: 10px; padding: 12px; transition: 0.1s; }
        .space-name { font-weight: 700; color: var(--accent2); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .suite-prompt-preview { font-size: 10px; color: #b0b3bc; background: #0a0c10; padding: 20px; border-radius: 8px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; line-height: 1.6; overflow: auto; max-height: none; min-height: 600px; transition: min-height 0.2s; }
        .suite-prompt-preview.collapsed { min-height: 200px; max-height: 200px; overflow-y: auto; }
        @media (min-width: 1400px) { .suite-prompt-preview { min-height: 800px; } }
        .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .fullscreen-content { background: var(--card); width: 90%; height: 90%; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--accent); }
        .fullscreen-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #1a1d24; border-bottom: 1px solid var(--border); }
        .fullscreen-title { font-size: 16px; font-weight: 700; color: var(--accent); }
        .fullscreen-body { flex: 1; overflow: auto; padding: 24px; white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.7; color: var(--text); }
        .close-fullscreen { background: transparent; border: none; color: var(--label); font-size: 24px; cursor: pointer; }
        .close-fullscreen:hover { color: var(--accent); }
        @media(max-width:1000px){.main{grid-template-columns:1fr;}.left-panel{height:auto;max-height:45vh;position:relative;top:0;}}
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left"><span class="logo">◆ 家装AI · 户型图智析系统</span><span class="topbar-title">全自动设计引擎 | 上传即分析</span></div>
    <div class="topbar-actions"><span class="badge" id="totalBadge">0组</span><button class="btn-ghost" onclick="clearAll()">清空</button><button class="btn-accent2" onclick="generateFullReport()">📐 全链路分析报告</button><button class="btn-accent" onclick="generatePrompts()">✨ 生成AI设计提示词</button></div>
</div>
<div class="main">
    <div class="left-panel">
        <div class="left-header"><span class="left-title">🏷️ 户型图智能分析 + 参数控制台</span><span class="selected-count" id="selCount">已选0项</span></div>
        <div class="left-scroll" id="leftScroll"></div>
    </div>
    <div class="right-panel">
        <div class="right-header">
            <span class="right-title" id="rightTitle">🏡 智能设计输出</span>
            <div class="right-tabs">
                <button class="right-tab active" data-tab="report" onclick="switchTab('report')">📊 分析报告</button>
                <button class="right-tab" data-tab="prompts" onclick="switchTab('prompts')">📝 提示词</button>
                <button class="right-tab" data-tab="budget" onclick="switchTab('budget')">💰 预算精算</button>
                <button class="right-tab" data-tab="fullsuite" onclick="switchTab('fullsuite')">🏆 5组全链路方案</button>
            </div>
            <button class="btn-ghost" id="copyAllBtn" onclick="copyAllPrompts()">📋 复制全部提示词</button>
            <button class="btn-ghost" id="copyAllSuiteBtn" onclick="copyCurrentSuiteFull()" style="display:none;">📋 复制当前方案全部5大组</button>
        </div>
        <div class="right-scroll" id="rightScroll"></div>
    </div>
</div>
<div class="toast" id="toast">✓ 已复制</div>
<script>
(function(){
    // --------------------------------------------------------------
    // 全域家装数据库 (完全保留)

        { id: "wall_surface", label: "🧱 墙面系统", multi: true, groups: [{ title: "墙面材质", options: "乳胶漆,艺术漆,微水泥,硅藻泥,墙布,墙纸,木饰面,格栅板,岩板背景墙,大理石背景墙,护墙板,皮革硬包,布艺软包,金属饰面,镜面不锈钢,镜面玻璃,长虹玻璃,文化石,夯土漆,水磨石墙面,洞石墙面".split(",").map(v=>({val:v,label:v})) }] },

            else if(areaVal<90) selections['space_scale'] = ['改善型90-120㎡'];

            projectInfo.area = areaVal;

        }
        let funcNeeds = [];

        if(analysis.ventilationLevel < 80) funcNeeds.push('智能新风');
        funcNeeds.push('全屋定制');
        selections['function_needs'] = funcNeeds;
        selections['lighting_system'] = ['无主灯照明', '磁吸轨道灯'];
        if(projectInfo.budget === '') projectInfo.budget = '35';

    function copyText(text, btn){

        if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>copySuccess(btn)).catch(fallback); else fallback(); 
    }
    function copySuccess(btn){ if(btn){ btn.classList.add('copied'); btn.textContent='✓ 已复制'; setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent='📋 复制'; },1800); } showToast('✅ 已复制'); }
    function copyError(btn){ if(btn){ btn.textContent='⚠ 重试'; setTimeout(()=>{ btn.textContent='📋 复制'; },2000); } showToast('❌ 复制失败'); }

        const descMap = {
            "玄关": `玄关柜(通顶+开放格)，换鞋凳(皮质软垫)，全身镜(落地/挂墙)，挂衣区(挂钩+挂杆)，灯光(感应灯带+射灯)，装饰摆件(艺术托盘+香薰)，绿植(琴叶榕/吊兰)。`,
            "客厅": `电视背景墙(岩板/木格栅)，电视柜(悬空+抽屉)，沙发(模块/直排)，单椅(休闲椅)，茶几(岩板+金属)，边几(圆形/石材)，地毯(羊毛/混纺)，落地灯(钓鱼灯/极简)，装饰画(抽象/摄影)，窗帘(梦幻帘/布艺)，绿植(龟背竹/橄榄树)，收纳柜(壁挂/开放式)。`,
            "餐厅": `餐桌(岩板/实木)，餐椅(皮质/藤编)，餐边柜(收纳+展示)，酒柜(玻璃门)，水吧台(咖啡机+杯架)，吊灯(线性/多头)，装饰画(静物/抽象)，摆件(花瓶/烛台)。`,
            "厨房": `橱柜(哑光烤漆/木纹)，吊柜(玻璃门/封闭)，岛台(岩板台面+抽屉)，灶台(嵌入式电磁炉)，油烟机(侧吸/集成)，水槽(大单槽+抽拉龙头)，冰箱(嵌入式)，蒸烤箱(嵌入式)，收纳系统(拉篮+转角小怪物)，灯光系统(手扫灯带+筒灯)。`,
            "主卧": `床(软包/实木)，床头柜(悬浮/传统)，背景墙(硬包/木饰面)，衣柜(一门到顶+玻璃门)，梳妆台(悬空+镜)，书桌(靠窗/转角)，休闲椅(毛毛虫/伊姆斯)，窗帘(遮光布艺+纱)，灯光系统(主灯+床头壁灯+线性灯带)。`,
            "次卧": `床(简约/收纳床)，衣柜(移门/平开)，书桌(吊柜+书架)，床头柜(小巧/壁挂)，软装摆件(台灯+相框)，灯光系统(吸顶灯+床头阅读灯)。`,
            "儿童房": `儿童床(上下床/树屋床)，学习桌(可升降)，书柜(矮柜+开放)，玩具柜(收纳箱)，收纳柜(衣柜+玩具区)，成长空间设计(活动区域+软垫)，灯光系统(护眼灯+氛围灯带)。`,
            "卫生间": `浴室柜(岩板台面+抽屉)，镜柜(智能镜+储物)，马桶(壁挂/智能)，淋浴区(玻璃隔断+恒温花洒)，浴缸(独立/嵌入式)，五金系统(黑色/枪灰色)，灯光系统(防水筒灯+镜前灯)，收纳系统(壁龛+置物架)。`,
            "阳台": `洗衣机(滚筒)，烘干机(热泵)，洗衣柜(石材+柜体)，收纳柜(家政工具)，绿植(大型盆栽/垂直绿化)，休闲桌椅(藤编/铁艺)，景观设计(鹅卵石/防腐木地板)。`
        };
        return descMap[spaceType] || "标准功能配置。";
    }

    // 生成一组完整方案
    function generateOneSuite(template, idx, houseType, areaVal, extraNeeds) {
        const styleName = template.name;
        const designSystem = `【设计方案${idx+1}】风格：${template.style} | 色彩：${template.color} | 材质：${template.material} | 灯光：${template.lighting} | 软装：${template.soft} | 设计理念：${template.designDesc} | 户型：${houseType} | 面积：${areaVal}㎡ | 额外需求：${extraNeeds}`;
        // 全屋空间方案
        const overall = `${designSystem}\n采用超广角连续透视构图，统一呈现玄关、客厅、餐厅、厨房、主卧、次卧、儿童房、卫生间、阳台。空间动线流畅，材质统一，灯光层次丰富。全屋${styleName}风格，摄影级超写实，8K，禁止分割画面。 --ar 16:9 --style raw`;
        // 分空间
        const spaces = {};
        const spaceNames = ["玄关","客厅","餐厅","厨房","主卧","次卧","儿童房","卫生间","阳台"];
        spaceNames.forEach(sp => {
            const furniture = generateSpaceDesc(sp, template);
            spaces[sp] = {
                name: sp,
                text: `${designSystem}\n【${sp}空间】${furniture} 延续整体${styleName}风格，材质统一，灯光协调。超写实渲染，人眼视角。 --ar 16:9`
            };
        });
        // 平面布局
        const layout = `${designSystem}\n【全屋平面布局方案】CAD建筑平面图，比例1:50，展示${houseType}完整结构。功能分区明确，家具按人体工程学布置，动线清晰，标注尺寸。专业彩平图风格。 --ar 1:1 --no color`;
        // 施工深化
        const construction = `${designSystem}\n【全屋施工深化方案】工程制图套件：天花吊顶、地面铺装、墙面立面、水电布置、灯光回路、柜体定制、节点大样。CAD标准表达，标注清晰。 --ar 16:9`;
        // 展示提案
        const proposal = `${designSystem}\n【全屋展示提案方案】全案汇报图集：鸟瞰图、漫游轴测、客餐厅联动、昼景/夜景、软装拼图、材质特写、设计展板。电影级调色，统一${styleName}风格。 --ar 16:9`;
        return { overall, spaces, layout, construction, proposal };
    }

    function generateAllSuites() {
        let houseType = getSel('huxing_type')[0] || (analysisResultCache?.houseType || "三房两厅");
        let areaVal = projectInfo.area || (analysisResultCache?.area || 115);
        let extra = getSel('function_needs').slice(0,2).join('、') || "全屋定制";
        let newSuites = [];
        for(let i=0; i<styleTemplates.length; i++) {
            newSuites.push(generateOneSuite(styleTemplates[i], i, houseType, areaVal, extra));
        }
        fullSuites = newSuites;
        if(currentTab === 'fullsuite') renderFullSuites();
        showToast("✅ 已生成5组不同方向的全链路方案");
    }

    function renderFullSuites() {
        if(!fullSuites.length) {
            dom.rightScroll.innerHTML = '<div class="report-card"><p>请先上传户型图或选择参数，系统将自动生成5组全链路方案。</p></div>';
            return;
        }
        // 渲染顶部Tab
        let tabsHtml = `<div class="suite-tabs">`;
        for(let i=0; i<fullSuites.length; i++) {
            tabsHtml += `<button class="suite-tab ${i===currentSuiteIndex ? 'active' : ''}" onclick="switchSuite(${i})">${styleTemplates[i].name} 方案</button>`;
        }
        tabsHtml += `</div>`;
        // 渲染当前方案内容
        const data = fullSuites[currentSuiteIndex];
        const template = styleTemplates[currentSuiteIndex];
        function renderModule(title, contentKey, content) {
            let displayContent = content || "正在生成方案内容……";
            let escaped = escapeHtml(displayContent);
            let moduleId = `module_${currentSuiteIndex}_${contentKey}`;
            return `
                <div class="full-suite-card">
                    <div class="suite-header">
                        <div class="suite-title">${title}</div>
                        <div class="btn-group">
                            <button class="btn-icon" onclick="toggleModuleCollapse('${moduleId}')">📄 展开/收起</button>
                            <button class="btn-icon" onclick="fullscreenModule('${moduleId}')">🖥️ 全屏查看</button>
                            <button class="btn-icon" onclick="copyModuleText('${moduleId}')">📋 复制全部内容</button>
                        </div>
                    </div>
                    <div style="padding: 14px;"><div id="${moduleId}" class="suite-prompt-preview" data-fulltext="${escaped.replace(/"/g, '&quot;')}">${escaped}</div></div>
                </div>
            `;
        }
        let spacesHtml = `<div class="full-suite-card"><div class="suite-header"><div class="suite-title">② 分空间方案提示词 (9大区域独立复制)</div></div><div class="spaces-grid" id="suiteSpacesGrid_${currentSuiteIndex}"></div></div>`;
        let fullHtml = tabsHtml + renderModule("① 全屋空间方案提示词 (整体统一场景)", "overall", data.overall) + spacesHtml + renderModule("③ 平面布局方案提示词", "layout", data.layout) + renderModule("④ 施工深化方案提示词", "construction", data.construction) + renderModule("⑤ 展示提案方案提示词", "proposal", data.proposal);
        dom.rightScroll.innerHTML = fullHtml;
        // 填充分空间网格
        const grid = document.getElementById(`suiteSpacesGrid_${currentSuiteIndex}`);
        if(grid && data.spaces) {
            let spacesGridHtml = '';
            for(let [key, val] of Object.entries(data.spaces)) {
                spacesGridHtml += `
                    <div class="space-item">
                        <div class="space-name">${val.name}<button class="btn-icon" style="padding:2px 8px;" onclick="copyText('${escapeHtml(val.text).replace(/'/g, "\\'")}', this)">复制</button></div>
                        <div class="suite-prompt-preview" style="min-height: auto; padding: 10px;">${escapeHtml(val.text)}</div>
                    </div>
                `;
            }
            grid.innerHTML = spacesGridHtml;
        }
        // 注册全局辅助函数
        window.toggleModuleCollapse = function(moduleId) {
            const el = document.getElementById(moduleId);
            if(el) el.classList.toggle('collapsed');
        };
        window.fullscreenModule = function(moduleId) {
            const el = document.getElementById(moduleId);
            if(!el) return;
            const text = el.getAttribute('data-fulltext') || el.innerText;
            showFullscreenModal(text);
        };
        window.copyModuleText = function(moduleId) {
            const el = document.getElementById(moduleId);
            if(!el) return;
            const text = el.getAttribute('data-fulltext') || el.innerText;
            copyText(text, null);
        };
    }

    function switchSuite(index) {
        currentSuiteIndex = index;
        renderFullSuites();
    }
    function copyCurrentSuiteFull() {
        if(!fullSuites.length || !fullSuites[currentSuiteIndex]) return;
        const data = fullSuites[currentSuiteIndex];
        let allText = `【方案名称】${styleTemplates[currentSuiteIndex].name}\n\n`;
        allText += `【全屋空间方案】\n${data.overall}\n\n---\n\n`;
        for(let [key, val] of Object.entries(data.spaces)) {
            allText += `【${val.name}空间】\n${val.text}\n\n---\n\n`;
        }
        allText += `【平面布局方案】\n${data.layout}\n\n---\n\n`;
        allText += `【施工深化方案】\n${data.construction}\n\n---\n\n`;
        allText += `【展示提案方案】\n${data.proposal}`;
        copyText(allText, null);
    }

    function showFullscreenModal(content) {
        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        modal.innerHTML = `
            <div class="fullscreen-content">
                <div class="fullscreen-header">
                    <span class="fullscreen-title">📄 完整提示词内容</span>
                    <button class="close-fullscreen">✕</button>
                </div>
                <div class="fullscreen-body">${escapeHtml(content)}</div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('.close-fullscreen').onclick = () => modal.remove();
        modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    function switchTab(tab){
        currentTab=tab; 
        $$('.right-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
        if(tab === 'prompts'){
            dom.copyAllBtn.style.display = 'inline-block';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '📝 AI提示词库';
            if(generatedPrompts.length) renderPrompts();
            else dom.rightScroll.innerHTML = '<div class="report-card"><p>请点击顶部「生成AI设计提示词」</p></div>';
        } else if(tab === 'report'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '📊 分析报告';
            if(fullReport) dom.rightScroll.innerHTML = fullReport;
            else generateFullReport();
        } else if(tab === 'budget'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'none';
            dom.rightTitle.textContent = '💰 报价精算';
            renderBudgetFull();
        } else if(tab === 'fullsuite'){
            dom.copyAllBtn.style.display = 'none';
            dom.copyAllSuiteBtn.style.display = 'inline-block';
            dom.rightTitle.textContent = '🏆 5组全链路方案';
            if(fullSuites.length) renderFullSuites();
            else { generateAllSuites(); renderFullSuites(); }
        }
    }

    window.switchSuite = switchSuite;
    window.copyCurrentSuiteFull = copyCurrentSuiteFull;
    window.toggleAccordion = toggleAccordion;
    window.generateFullReport = generateFullReport;
    window.generatePrompts = generatePrompts;
    window.copySinglePrompt = copySinglePrompt;
    window.copyAllPrompts = copyAllPrompts;
    window.clearAll = clearAll;
    window.switchTab = switchTab;
    window.copyText = copyText;

    buildLeft(); 
    updateSelCount(); 
    setTimeout(()=>{
        generateFullReport();
        generateAllSuites();
    },200);
})();
</script>
</body>
</html>
